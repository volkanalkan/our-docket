name: OurDocket
options:
  bundleIdPrefix: com.volkan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0

targets:
  OurDocket:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OurDocket
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Our Docket"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsFullAccessUsageDescription: "Kararlarını Apple Takvim'ine ekleyebilmek için takvim erişimi gerekiyor."
        NSCalendarsWriteOnlyAccessUsageDescription: "Kararlarını Apple Takvim'ine ekleyebilmek için takvim erişimi gerekiyor."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volkan.ourdocket
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
        DEVELOPMENT_TEAM: N479NWL495
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OurDocket/OurDocket.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
